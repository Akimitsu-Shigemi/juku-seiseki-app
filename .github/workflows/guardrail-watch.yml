name: guardrail-watch
# ガードレール/フック/ルールのファイルが変わったら GitHub Issue を自動作成して通知する。
# サーバー側(GitHub)で動くのでAIが止められない。Slack等の外部サービス・secretは不要。
# 作成されたIssueはオーナーに割り当てられ、GitHubからメール通知が届く。

# main に変更が入ったときだけ通知する（＝1変更=1件）。
# ブランチ上の作業やPRの段階では鳴らさず、マージで main に入った瞬間に1件だけIssueを作る。
on:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'SECURITY.md'
      - 'SPEC.md'
      - '.claude/**'
      - 'hooks/**'
      - 'tools/guardrail-*'
      - '.github/workflows/guardrail-watch.yml'
      - '.github/CODEOWNERS'

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 変更ファイルを検出
        id: diff
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" -- \
            AGENTS.md SECURITY.md SPEC.md .claude hooks 'tools/guardrail-*' \
            .github/workflows/guardrail-watch.yml .github/CODEOWNERS 2>/dev/null || true)
          {
            echo "changed<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: GitHub Issue で通知
        if: steps.diff.outputs.changed != ''
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        with:
          script: |
            const changed = process.env.CHANGED || '(不明)';
            const sha = context.sha.substring(0, 7);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠ ガードレール/フックが変更されました (${sha})`,
              body: [
                `ブランチ: ${context.ref}`,
                `変更者: ${context.actor}`,
                `コミット: ${url}`,
                '',
                '変更ファイル:',
                '```',
                changed,
                '```',
                '',
                '意図した変更なら、このIssueを閉じてください。心当たりがなければ内容を確認してください。'
              ].join('\n'),
              assignees: ['Akimitsu-Shigemi']
            });
