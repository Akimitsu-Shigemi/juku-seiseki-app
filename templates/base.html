<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ juku_name }}{% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161a26; --ink-soft:#4b5366; --paper:#f7f4ee; --card:#ffffff;
    --line:#e7e1d6; --accent:#c1272d; --accent-deep:#9a1f24; --gold:#b8975a;
    --navy:#0f1320; --ok:#276749; --warn:#8a5a12; --ng:#9b2c2c;
    --shadow:0 1px 2px rgba(20,26,38,.04),0 8px 28px rgba(20,26,38,.07);
    --serif:"Shippori Mincho B1",serif; --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans); margin:0; background:var(--paper); color:var(--ink);
       line-height:1.75; letter-spacing:.01em; -webkit-font-smoothing:antialiased}
  a{color:var(--accent-deep); text-underline-offset:3px; text-decoration-thickness:1px}
  a:hover{color:var(--accent)}

  /* ヘッダー */
  header{position:sticky; top:0; z-index:20; background:rgba(247,244,238,.86);
    backdrop-filter:saturate(1.1) blur(10px); border-bottom:1px solid var(--line);
    padding:14px clamp(16px,4vw,40px); display:flex; justify-content:space-between;
    align-items:center; gap:12px}
  header .brand{display:flex; align-items:baseline; gap:10px; min-width:0}
  header .brand .name{font-family:var(--serif); font-weight:800; font-size:clamp(15px,2.4vw,19px);
    letter-spacing:.02em; white-space:nowrap}
  header .brand .tag{color:var(--ink-soft); font-size:12px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  header .who{font-size:13px; color:var(--ink-soft); white-space:nowrap}
  @media(max-width:560px){ header .brand .tag{display:none} }

  main{max-width:960px; margin:0 auto; padding:clamp(20px,4vw,40px) clamp(16px,4vw,24px)}
  h1{font-family:var(--serif); font-weight:800; font-size:clamp(22px,3.4vw,30px);
     letter-spacing:.01em; line-height:1.3; margin:.2em 0 .5em}
  h2{font-family:var(--serif); font-weight:700; font-size:clamp(17px,2.4vw,21px);
     margin:1.6em 0 .6em; padding-bottom:.35em; border-bottom:2px solid var(--line)}
  h3{font-family:var(--serif); font-weight:700; font-size:16px; margin:1.2em 0 .5em}

  /* 表（上質なエディトリアル） */
  table{border-collapse:separate; border-spacing:0; width:100%; background:var(--card);
    margin:14px 0; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:var(--shadow); font-size:14px}
  th,td{padding:11px 13px; text-align:center; border-bottom:1px solid var(--line)}
  th{background:#faf7f1; font-weight:700; color:var(--ink); font-size:13px; letter-spacing:.02em}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td, table tr:hover td{background:#fcfaf5}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 22px; background:var(--accent); color:#fff; border:0; border-radius:999px;
    text-decoration:none; cursor:pointer; font-size:15px; font-weight:700; font-family:var(--sans);
    box-shadow:0 6px 18px rgba(193,39,45,.28); transition:transform .15s ease, box-shadow .15s ease, background .15s ease}
  .btn:hover{background:var(--accent-deep); transform:translateY(-1px); box-shadow:0 10px 24px rgba(193,39,45,.34); color:#fff}
  .btn:active{transform:translateY(0)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:clamp(16px,3vw,22px); margin:14px 0; box-shadow:var(--shadow)}
  .muted{color:var(--ink-soft); font-size:13px}
  .err{background:#fcecec; border:1px solid #e6b9b9; color:var(--ng); padding:12px 14px;
    border-radius:12px; font-size:14px}
  input[type=text],input[type=password],input:not([type]),input[type=number]{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; font-family:var(--sans); background:#fff; transition:border-color .15s, box-shadow .15s}
  input:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px rgba(193,39,45,.12)}
  label{font-weight:500}

  @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  @media(prefers-reduced-motion:reduce){ .rise{animation:none} }
  {% block head_extra %}{% endblock %}
</style>
</head>
<body>
{% block body %}
<header>
  <span class="brand">
    <span class="name">{{ juku_name }}</span>
    <span class="tag">{{ juku_tagline }}</span>
  </span>
  {% if user %}<span class="who">{{ user.name }}（{{ user.role }}）｜<a href="{{ url_for('logout') }}">ログアウト</a></span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
{% endblock %}
</body>
</html>
