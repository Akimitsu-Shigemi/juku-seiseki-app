{% extends "base.html" %}
{% block content %}
<h1>ログイン</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" class="card" style="max-width:360px">
  <p><label>ID<br><input name="username" autocomplete="username" required></label></p>
  <p><label>パスワード<br><input name="password" type="password" autocomplete="current-password" required></label></p>
  <button class="btn" type="submit">ログイン</button>
</form>
{% endblock %}
